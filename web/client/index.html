<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>LifeBookz — Preserve Your Life Stories & Memories</title>

    <meta
      name="description"
      content="LifeBookz helps you write, organize, and preserve your life stories, memories, experiences, and important moments for generations to come. It also gives you one to one consultancy"
    />

    <link rel="canonical" href="https://lifebookz.com/" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicons/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicons/favicon.svg"
    />
    <link
      rel="shortcut icon"
      href="/favicons/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="/favicons/site.webmanifest"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lifebookz.com/" />
    <meta
      property="og:title"
      content="LifeBookz — Preserve Your Life Stories & Memories"
    />
    <meta
      property="og:description"
      content="Write, organize, and preserve your life stories, memories, and experiences with LifeBookz."
    />
    <meta
      property="og:image"
      content="https://lifebookz.com/og-image.png"
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="LifeBookz — Preserve Your Life Stories & Memories"
    />
    <meta
      name="twitter:description"
      content="Write, organize, and preserve your life stories, memories, and experiences with LifeBookz."
    />
    <meta
      name="twitter:image"
      content="https://lifebookz.com/og-image.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
